<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>재무빅데이터 분석사</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.course-img { transition: opacity 1s ease-in-out; }</style>
</head>
<body class="bg-white text-slate-900">
    <nav class="flex items-center justify-between p-6 border-b border-gray-100">
        <a href="index.html" class="text-2xl font-black tracking-tighter">이지컴스쿨</a>
        <a href="index.html" class="bg-slate-100 px-4 py-2 rounded-full text-sm font-bold hover:bg-slate-200 transition-all">← 메인으로 돌아가기</a>
    </nav>
    <div class="max-w-4xl mx-auto py-12 px-6">
        <h1 class="text-4xl font-extrabold mb-6">생성형 AI 전문가</h1>
<div class="relative h-64 overflow-hidden rounded-2xl mb-8">
    <img src="IMG/ai_1.jfif" class="course-img absolute inset-0 w-full h-full object-cover">
    <img src="IMG/ai_2.jfif" class="course-img absolute inset-0 w-full h-full object-cover opacity-0">
    <img src="IMG/ai_3.jfif" class="course-img absolute inset-0 w-full h-full object-cover opacity-0">
</div>
<div class="prose max-w-none text-gray-700 leading-relaxed">
    <h2 class="text-2xl font-bold mb-4">과정 소개</h2>
    <p class="mb-6">초거대 AI 모델의 원리를 이해하고, 업무 자동화와 콘텐츠 생성에 활용하는 과정입니다.</p>
    <h2 class="text-2xl font-bold mb-4">주요 학습 내용</h2>
    <ul class="list-disc pl-5 mb-6 space-y-2">
        <li>LLM 구조와 동작 원리</li>
        <li>프롬프트 엔지니어링 실무</li>
        <li>AI 자동화 도구 및 API 활용</li>
    </ul>
    <div class="bg-blue-50 p-6 rounded-xl border border-blue-100">
        <h3 class="font-bold text-blue-900">이런 분들께 추천합니다!</h3>
        <p>AI 기술을 활용해 업무 생산성을 극대화하고 싶은 사무직 및 기술직 종사자.</p>
    </div>
</div>
    <script>
        let idx = 0;
        const imgs = document.querySelectorAll('.course-img');
        setInterval(() => {
            imgs[idx].classList.add('opacity-0');
            idx = (idx + 1) % imgs.length;
            imgs[idx].classList.remove('opacity-0');
        }, 3000);
    </script>
</body>
</html>
