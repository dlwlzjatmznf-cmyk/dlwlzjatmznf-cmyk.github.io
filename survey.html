<input id="cq7">

<button class="submit-btn" type="submit">

</button>

</form>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyvAKH75bL5iSh2EaobMqaBLBXBxMOd1k1TALVS1xZGgebU35nqK9iBwYzWzHodbvZMeA/exec";

function showForm(type){

document.getElementById('surveyType').value = type;

document.getElementById('personalForm').classList.add('hidden');
document.getElementById('companyForm').classList.add('hidden');

if(type==="personal"){
document.getElementById('personalForm').classList.remove('hidden');
}

if(type==="company"){
document.getElementById('companyForm').classList.remove('hidden');
}

}

document.getElementById("surveyForm")
.addEventListener("submit",async function(e){

e.preventDefault();

const data = {
type : document.getElementById('surveyType').value
};

document.querySelectorAll("input,select")
.forEach(el=>{
if(el.id){
data[el.id]=el.value;
}
});

await fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify(data)
});

alert("수요조사가 정상적으로 제출되었습니다.");

this.reset();

});

</script>
