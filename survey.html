<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>교육 수요조사</title>

<style>

body{
font-family:'맑은 고딕';
background:#f5f7fb;
margin:0;
padding:30px;
}

.container{
max-width:900px;
margin:auto;
background:#fff;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#003a8c;
}

.type{
display:flex;
gap:20px;
justify-content:center;
margin-bottom:30px;
}

.type button{
padding:15px 30px;
border:none;
background:#003a8c;
color:white;
cursor:pointer;
border-radius:6px;
}

.question{
margin-bottom:20px;
}

label{
display:block;
margin-bottom:5px;
font-weight:bold;
}

input,select{
width:100%;
padding:10px;
}

.hidden{
display:none;
}

.submit-btn{
width:100%;
padding:15px;
background:#0057d8;
color:white;
border:none;
font-size:18px;
cursor:pointer;
}

</style>

</head>
<body>

<div class="container">

<h1>교육 수요조사</h1>

<div class="type">
<button onclick="showPersonal()">일반인(구직자)</button>
<button onclick="showCompany()">기업체</button>
</div>

<form id="surveyForm">

<input type="hidden" id="type">

<div id="personal" class="hidden">

<div class="question">
<label>성명</label>
<input id="name">
</div>

<div class="question">
<label>연락처</label>
<input id="phone">
</div>

<div class="question">
<label>Q1 연령대</label>
<select id="q1">
<option>20대 이하</option>
<option>30대</option>
<option>40대</option>
<option>50대</option>
<option>60대 이상</option>
</select>
</div>

<div class="question">
<label>Q2 경제활동 상태</label>
<input id="q2">
</div>

<div class="question"><label>Q3 국민내일배움카드</label><input id="q3"></div>
<div class="question"><label>Q4 생성형AI 인식</label><input id="q4"></div>
<div class="question"><label>Q5 배우고 싶은 직무</label><input id="q5"></div>
<div class="question"><label>Q6 참여 의향</label><input id="q6"></div>
<div class="question"><label>Q7 관심 이유</label><input id="q7"></div>
<div class="question"><label>Q8 선호 기간</label><input id="q8"></div>
<div class="question"><label>Q9 중요 요소</label><input id="q9"></div>
<div class="question"><label>Q10 지원사항</label><input id="q10"></div>

</div>

<div id="company" class="hidden">

<div class="question">
<label>기업명</label>
<input id="cname">
</div>

<div class="question">
<label>담당자</label>
<input id="manager">
</div>

<div class="question">
<label>연락처</label>
<input id="cphone">
</div>

<div class="question"><label>Q1 업종</label><input id="cq1"></div>
<div class="question"><label>Q2 근로자수</label><input id="cq2"></div>
<div class="question"><label>Q3 개선분야</label><input id="cq3"></div>
<div class="question"><label>Q4 AI도입계획</label><input id="cq4"></div>
<div class="question"><label>Q5 선호역량</label><input id="cq5"></div>
<div class="question"><label>Q6 채용의향</label><input id="cq6"></div>
<div class="question"><label>Q7 기대효과</label><input id="cq7"></div>
<div class="question"><label>Q8 MOU의향</label><input id="cq8"></div>
<div class="question"><label>Q9 재직자교육</label><input id="cq9"></div>
<div class="question"><label>Q10 기관역할</label><input id="cq10"></div>

</div>

<button class="submit-btn">
제출하기
</button>

</form>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyvAKH75bL5iSh2EaobMqaBLBXBxMOd1k1TALVS1xZGgebU35nqK9iBwYzWzHodbvZMeA/exec";

function showPersonal(){

document.getElementById("personal").classList.remove("hidden");
document.getElementById("company").classList.add("hidden");

document.getElementById("type").value="personal";
}

function showCompany(){

document.getElementById("company").classList.remove("hidden");
document.getElementById("personal").classList.add("hidden");

document.getElementById("type").value="company";
}

document.getElementById("surveyForm")
.addEventListener("submit",function(e){

e.preventDefault();

const data={};

document.querySelectorAll("input,select")
.forEach(el=>{
if(el.id){
data[el.id]=el.value;
}
});

fetch(SCRIPT_URL,{
method:"POST",
mode:"no-cors",
body:JSON.stringify(data)
});

alert("수요조사가 제출되었습니다.");

this.reset();

});

</script>

</body>
</html>
