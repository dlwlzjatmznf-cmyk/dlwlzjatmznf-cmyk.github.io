    <div class="max-w-4xl mx-auto bg-white p-12 rounded-3<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>훈련과정 상세 안내</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .course-img { transition: opacity 1s ease-in-out; }
    </style>
</head>
<body class="bg-white text-slate-900">

    <nav class="flex items-center justify-between p-6 border-b border-gray-100">
        <a href="index.html" class="text-2xl font-black tracking-tighter">이지컴스쿨</a>
        <a href="index.html" class="bg-slate-100 px-4 py-2 rounded-full text-sm font-bold hover:bg-slate-200 transition-all">← 메인으로 돌아가기</a>
    </nav>

     <div class="max-w-4xl mx-auto py-12 px-6">
    <h1 class="text-4xl font-extrabold text-slate-900 mb-6">FAT / TAT 회계 실무</h1>
    
    <div class="relative h-64 overflow-hidden rounded-2xl mb-8">
        <img src="IMG/fin_1.jfif" class="course-img absolute inset-0 w-full h-full object-cover transition-opacity duration-1000">
        <img src="IMG/fin_2.jfif" class="course-img absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 opacity-0">
        <img src="IMG/fin_3.jfif" class="course-img absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 opacity-0">
    </div>

    <div class="prose max-w-none text-gray-700 leading-relaxed">
        <h2 class="text-2xl font-bold mb-4">과정 소개</h2>
        <p class="mb-6">기업 회계 업무의 핵심인 FAT(회계)와 TAT(세무) 자격증 취득 및 실무 능력 배양을 위한 표준 과정입니다.</p>

        <h2 class="text-2xl font-bold mb-4">주요 학습 내용</h2>
        <ul class="list-disc pl-5 mb-6 space-y-2">
            <li>회계 기초 및 재무제표 작성 실무</li>
            <li>부가가치세 및 소득세 세무 실무</li>
            <li>더존/세무회계 프로그램 운용 교육</li>
            <li>국가공인 자격증 취득 대비 기출 풀이</li>
        </ul>
    </div>
</div>

<script>
    // 이미지 자동 슬라이드 로직
    let idx = 0;
    const imgs = document.querySelectorAll('.course-img');
    setInterval(() => {
        imgs[idx].classList.add('opacity-0');
        idx = (idx + 1) % imgs.length;
        imgs[idx].classList.remove('opacity-0');
    }, 3000);
</script>
</body>
</html>
